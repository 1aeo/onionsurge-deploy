name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install pinned rclone for loopback S3 integration tests
        shell: bash
        env:
          PINNED_RCLONE_TAG: v1.76.0
          PINNED_RCLONE_SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="rclone-${PINNED_RCLONE_TAG}-linux-amd64.zip"
          curl -fsSL --retry 3 "https://github.com/rclone/rclone/releases/download/${PINNED_RCLONE_TAG}/${archive}" -o "${tmp}/${archive}"
          printf '%s  %s\n' "${PINNED_RCLONE_SHA256}" "${tmp}/${archive}" | sha256sum -c -
          unzip -q -j "${tmp}/${archive}" "rclone-${PINNED_RCLONE_TAG}-linux-amd64/rclone" -d "${tmp}"
          install -m 0755 "${tmp}/rclone" "${RUNNER_TEMP}/rclone"
          "${RUNNER_TEMP}/rclone" version
      - name: Run checks
        env:
          ONIONSURGE_TEST_RCLONE: ${{ runner.temp }}/rclone
        run: make check
